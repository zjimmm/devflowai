spring:
  application:
    name: devflowai
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
  datasource:
    url: jdbc:h2:file:~/.devflowai/history/devflowai
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

devflowai:
  review:
    max-iterations: 3
    max-human-iterations: 5
  gate:
    timeout-minutes: 10
  build:
    timeout-minutes: 5
  fixture:
    path: src/test/resources/fixture
  clone:
    timeout-minutes: 2
  policy:
    require-build-pass: true
