spring:
  application:
    name: devflowai
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}

devflowai:
  review:
    max-iterations: 3
    max-human-iterations: 5
  gate:
    timeout-minutes: 10
  build:
    timeout-minutes: 5
  fixture:
    path: src/test/resources/fixture
  clone:
    timeout-minutes: 2
