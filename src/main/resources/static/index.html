<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>devflowai</title>
  <style>
    :root { color-scheme: light dark; --fg:#1a1a1a; --bg:#fbfbfa; --muted:#6b6b6b;
            --line:#e0e0dc; --accent:#2d6a4f; --warn:#9a3412; }
    @media (prefers-color-scheme: dark) {
      :root { --fg:#e8e8e6; --bg:#1c1c1b; --muted:#9a9a97; --line:#333331;
              --accent:#74c69d; --warn:#fb923c; }
    }
    * { box-sizing: border-box; }
    body { margin:0; padding:2rem 1rem; background:var(--bg); color:var(--fg);
           font:15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif; }
    main { max-width: 46rem; margin: 0 auto; }
    h1 { font-size:1.1rem; letter-spacing:-0.01em; margin:0 0 1.5rem; }
    label { display:block; font-size:0.8rem; color:var(--muted); margin-bottom:0.3rem; }
    .row { margin-bottom:0.9rem; }
    input, select, textarea { width:100%; padding:0.55rem 0.7rem; font:inherit;
      color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; }
    textarea { resize:vertical; }
    input:disabled, textarea:disabled { opacity:0.6; }
    button { font:inherit; padding:0.5rem 1.1rem; border-radius:6px; cursor:pointer;
      border:1px solid var(--line); background:var(--bg); color:var(--fg); }
    button.primary { background:var(--accent); border-color:var(--accent); color:var(--bg); }
    button:disabled { opacity:0.45; cursor:not-allowed; }
    .doc-info { margin-top:0.5rem; display:flex; align-items:center; gap:0.6rem;
      color:var(--muted); font-size:0.85rem; }
    .doc-info button { padding:0.15rem 0.55rem; font-size:0.8rem; }
    hr { border:0; border-top:1px solid var(--line); margin:1.5rem 0; }
    #log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; }
    .ev { padding:0.3rem 0; border-bottom:1px solid var(--line); }
    .ev .t { color:var(--muted); margin-right:0.5rem; }
    .ev.error .m, .ev.aborted .m { color:var(--warn); }
    .ev.done .m { color:var(--accent); }
    .files { color:var(--muted); padding-left:1.4rem; }
    #gate { border:1px solid var(--accent); border-radius:8px; padding:1rem; margin-top:1rem; }
    #gate h2 { font-size:0.95rem; margin:0 0 0.6rem; }
    .hidden { display:none; }
    .actions { display:flex; gap:0.6rem; margin-top:0.8rem; }
  </style>
</head>
<body>
<main>
  <h1>devflowai</h1>

  <section id="start">
    <div class="row">
      <label for="repo">Repo</label>
      <select id="repo"><option value="fixture">bundled fixture</option></select>
      <input id="repo-url" placeholder="or paste a public https:// git URL instead" style="margin-top:0.4rem">
    </div>
    <div class="row">
      <label for="task">Task</label>
      <textarea id="task" rows="4" placeholder="Add input validation to UserController and cover it with tests.">Add input validation to UserController so a null or blank email is rejected with HTTP 400. Cover it with a test.</textarea>
    </div>
    <div class="row">
      <label for="doc">Attach a PRD or task doc instead (.md/.txt, optional — replaces the text above)</label>
      <input id="doc" type="file" accept=".md,.markdown,.txt">
      <div id="doc-info" class="doc-info hidden">
        <span id="doc-name"></span>
        <button id="doc-remove" type="button">✕ remove</button>
      </div>
    </div>
    <div class="row">
      <label for="strategy">Strategy</label>
      <select id="strategy">
        <option value="orchestrated">Orchestrated (planner, reviewer, gates)</option>
        <option value="direct">Direct (single coder pass, no review)</option>
      </select>
    </div>
    <div class="row">
      <label style="display:flex; align-items:center; gap:0.5rem;">
        <input id="open-pr" type="checkbox" style="width:auto;">
        Open a pull request when done (requires a real repo, not the bundled fixture)
      </label>
    </div>
    <div class="row">
      <label style="display:flex; align-items:center; gap:0.5rem;">
        <input id="release" type="checkbox" style="width:auto;">
        After passed CI and a manual PR merge, dispatch the configured release workflow
      </label>
    </div>
    <button id="run" class="primary">Run</button>
  </section>

  <hr>

  <section id="log"></section>

  <section id="gate" class="hidden">
    <h2 id="gate-title"></h2>
    <div id="gate-detail" class="files"></div>
    <div class="row" style="margin-top:0.8rem">
      <label id="reason-label" for="reason">reason (optional — a rejection with a reason sends it back to the coder)</label>
      <input id="reason" placeholder="use a DTO, don't annotate the entity">
    </div>
    <div class="actions">
      <button id="approve" class="primary">Approve</button>
      <button id="reject">Reject</button>
    </div>
  </section>

  <hr>

  <section id="history">
    <h2 style="font-size:0.95rem; margin:0 0 0.6rem;">Past runs</h2>
    <button id="history-refresh" type="button">Refresh</button>
    <table style="width:100%; border-collapse:collapse; margin-top:0.6rem; font-size:0.85rem;">
      <thead>
        <tr style="text-align:left; color:var(--muted);">
          <th style="padding:0.3rem 0;">Task</th>
          <th>Strategy</th>
          <th>Status</th>
          <th>Build</th>
          <th>PR</th>
          <th>CI</th>
          <th>Release</th>
          <th>Verify</th>
          <th>Audit</th>
          <th>Started</th>
        </tr>
      </thead>
      <tbody id="history-body"></tbody>
    </table>
  </section>

  <section id="audit" class="hidden">
    <h2 id="audit-title" style="font-size:0.95rem; margin:1.2rem 0 0.6rem;">Run audit</h2>
    <button id="audit-close" type="button">Close audit</button>
    <div id="audit-list" style="margin-top:0.6rem;"></div>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let runId = null;

  function log(type, message, data) {
    const el = document.createElement('div');
    el.className = 'ev ' + type;
    const time = new Date().toLocaleTimeString();
    el.innerHTML = `<span class="t">${time}</span><span class="m"></span>`;
    el.querySelector('.m').textContent = message;
    if (data && Array.isArray(data.filesTouched) && data.filesTouched.length) {
      const files = document.createElement('div');
      files.className = 'files';
      files.textContent = data.filesTouched.join('  ·  ');
      el.appendChild(files);
    }
    if (data && (data.inputTokens !== undefined || data.outputTokens !== undefined)) {
      const cost = document.createElement('div');
      cost.className = 'files'; // reuse the existing muted-text style
      cost.textContent = `${data.inputTokens || 0} input tokens · ${data.outputTokens || 0} output tokens`;
      el.appendChild(cost);
    }
    if (data && data.prUrl) {
      const pr = document.createElement('div');
      pr.className = 'files';
      const link = document.createElement('a');
      link.href = data.prUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'View pull request';
      pr.appendChild(link);
      el.appendChild(pr);
    }
    if (data && data.releaseUrl) {
      const release = document.createElement('div');
      release.className = 'files';
      const link = document.createElement('a');
      link.href = data.releaseUrl;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = 'View release workflow';
      release.appendChild(link);
      el.appendChild(release);
    }
    if (data && Array.isArray(data.ciChecks) && data.ciChecks.length) {
      const checks = document.createElement('div');
      checks.className = 'files';
      data.ciChecks.forEach(check => {
        const row = document.createElement('div');
        const label = `${check.name}: ${check.status}${check.conclusion ? ` (${check.conclusion})` : ''}`;
        if (check.detailsUrl) {
          const link = document.createElement('a');
          link.href = check.detailsUrl;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = label;
          row.appendChild(link);
        } else {
          row.textContent = label;
        }
        checks.appendChild(row);
      });
      el.appendChild(checks);
    }
    $('log').appendChild(el);
    el.scrollIntoView({ block: 'nearest' });
  }

  function showGate(message, data) {
    $('gate-title').textContent = message;
    $('reason-label').textContent = data && data.gate === 'BEFORE_RELEASE'
      ? 'reason (optional — records why release was not dispatched)'
      : 'reason (optional — a rejection with a reason sends it back to the coder)';
    const files = (data && data.filesTouched) || [];
    let detail = files.length ? files.join('\n') : '';
    if (data && data.skillDraft) {
      detail += (detail ? '\n\n' : '') + `Learned: ${data.skillDraft.name} — ${data.skillDraft.description}`;
    }
    if (data && data.memoryFact) {
      detail += (detail ? '\n' : '') + `Remembered: ${data.memoryFact}`;
    }
    $('gate-detail').textContent = detail;
    $('reason').value = '';
    $('gate').classList.remove('hidden');
  }

  function hideGate() { $('gate').classList.add('hidden'); }

  async function decide(approved) {
    const reason = $('reason').value.trim();
    hideGate();
    const res = await fetch(`/api/runs/${runId}/approve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ approved, reason: reason || null })
    });
    if (!res.ok) log('error', `Could not submit that decision (HTTP ${res.status})`);
  }

  $('approve').onclick = () => decide(true);
  $('reject').onclick = () => decide(false);

  const MAX_DOC_BYTES = 100 * 1024;
  const DOC_EXT_RE = /\.(md|markdown|txt)$/i;

  $('doc').onchange = async () => {
    const file = $('doc').files[0];
    $('doc').value = ''; // clears the picker so the same file can be re-selected later
    if (!file) return;

    if (!DOC_EXT_RE.test(file.name)) {
      log('error', `"${file.name}" isn't a .md/.markdown/.txt file`);
      return;
    }
    if (file.size === 0) {
      log('error', `"${file.name}" is empty`);
      return;
    }
    if (file.size > MAX_DOC_BYTES) {
      log('error', `"${file.name}" is ${(file.size / 1024).toFixed(1)} KB, over the 100 KB limit`);
      return;
    }

    $('task').value = await file.text();
    $('task').disabled = true;
    $('doc-name').textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
    $('doc-info').classList.remove('hidden');
  };

  $('doc-remove').onclick = () => {
    $('task').value = '';
    $('task').disabled = false;
    $('doc-info').classList.add('hidden');
  };

  $('run').onclick = async () => {
    const task = $('task').value.trim();
    if (!task) return;
    const repoUrl = $('repo-url').value.trim();
    if (repoUrl && !repoUrl.startsWith('https://')) {
      log('error', 'Repo URL must start with https://');
      return;
    }
    const repo = repoUrl || $('repo').value;
    $('run').disabled = true;
    $('log').innerHTML = '';
    hideGate();

    const res = await fetch('/api/runs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task, repo, strategy: $('strategy').value, openPr: $('open-pr').checked,
        release: $('release').checked })
    });
    if (!res.ok) {
      log('error', `Could not start the run (HTTP ${res.status})`);
      $('run').disabled = false;
      return;
    }
    runId = (await res.json()).runId;
    log('step', `Run ${runId} started`);

    const source = new EventSource(`/api/runs/${runId}/stream`);
    const onEvent = (e) => {
      const payload = JSON.parse(e.data);
      if (payload.type === 'gate') showGate(payload.message, payload.data);
      else log(payload.type, payload.message, payload.data);
      if (payload.type === 'done' || payload.type === 'error' || payload.type === 'aborted') {
        source.close();
        $('run').disabled = false;
      }
    };
    ['step', 'gate', 'done', 'error', 'aborted', 'warn'].forEach(n => source.addEventListener(n, onEvent));
    source.onerror = () => { source.close(); $('run').disabled = false; };
  };

  $('release').onchange = () => {
    if ($('release').checked) $('open-pr').checked = true;
  };
  $('open-pr').onchange = () => {
    if (!$('open-pr').checked) $('release').checked = false;
  };

  function renderHistory(rows) {
    const body = $('history-body');
    body.innerHTML = '';
    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.style.borderTop = '1px solid var(--line)';

      const task = r.task.length > 60 ? r.task.slice(0, 60) + '…' : r.task;
      const taskCell = document.createElement('td');
      taskCell.style.padding = '0.3rem 0';
      taskCell.textContent = task;

      const strategyCell = document.createElement('td');
      strategyCell.textContent = r.strategy || '';

      const statusCell = document.createElement('td');
      statusCell.textContent = r.status;

      const buildCell = document.createElement('td');
      buildCell.textContent = r.buildSucceeded === true ? 'passed' : r.buildSucceeded === false ? 'failed' : '';

      const prCell = document.createElement('td');
      if (r.prUrl) {
        const prLink = document.createElement('a');
        prLink.href = r.prUrl;
        prLink.target = '_blank';
        prLink.rel = 'noopener noreferrer';
        prLink.textContent = 'PR';
        prCell.appendChild(prLink);
      }

      const ciCell = document.createElement('td');
      ciCell.textContent = r.ciStatus || '';

      const releaseCell = document.createElement('td');
      if (r.releaseUrl) {
        const releaseLink = document.createElement('a');
        releaseLink.href = r.releaseUrl;
        releaseLink.target = '_blank';
        releaseLink.rel = 'noopener noreferrer';
        releaseLink.textContent = r.releaseStatus || 'release';
        releaseCell.appendChild(releaseLink);
      } else {
        releaseCell.textContent = r.releaseStatus || '';
      }

      const verificationCell = document.createElement('td');
      verificationCell.textContent = r.verificationStatus || '';

      const auditCell = document.createElement('td');
      const auditButton = document.createElement('button');
      auditButton.type = 'button';
      auditButton.textContent = 'View';
      auditButton.onclick = () => loadAudit(r.runId);
      auditCell.appendChild(auditButton);

      const startedCell = document.createElement('td');
      startedCell.textContent = new Date(r.startedAt).toLocaleString();

      tr.appendChild(taskCell);
      tr.appendChild(strategyCell);
      tr.appendChild(statusCell);
      tr.appendChild(buildCell);
      tr.appendChild(prCell);
      tr.appendChild(ciCell);
      tr.appendChild(releaseCell);
      tr.appendChild(verificationCell);
      tr.appendChild(auditCell);
      tr.appendChild(startedCell);
      body.appendChild(tr);
    });
  }

  async function loadHistory() {
    const res = await fetch('/api/runs/history');
    if (!res.ok) return;
    renderHistory(await res.json());
  }

  $('history-refresh').onclick = loadHistory;

  function renderAudit(entries) {
    const list = $('audit-list');
    list.innerHTML = '';
    entries.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'ev';
      const time = document.createElement('span');
      time.className = 't';
      time.textContent = new Date(entry.occurredAt).toLocaleString();
      const meta = document.createElement('span');
      meta.className = 't';
      meta.textContent = [entry.actor, entry.action, entry.phase].filter(Boolean).join(' · ');
      const message = document.createElement('span');
      message.className = 'm';
      message.textContent = entry.message;
      row.appendChild(time);
      row.appendChild(meta);
      row.appendChild(message);
      list.appendChild(row);
    });
  }

  async function loadAudit(id) {
    const res = await fetch(`/api/runs/${id}/audit`);
    if (!res.ok) {
      log('error', `Could not load audit history (HTTP ${res.status})`);
      return;
    }
    $('audit-title').textContent = `Run ${id} audit`;
    renderAudit(await res.json());
    $('audit').classList.remove('hidden');
    $('audit').scrollIntoView({ block: 'nearest' });
  }

  $('audit-close').onclick = () => $('audit').classList.add('hidden');
  loadHistory();
</script>
</body>
</html>
